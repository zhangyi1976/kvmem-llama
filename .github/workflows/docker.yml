name: Build Docker image (CUDA 12.9)

# Manual trigger: the upstream tag trees do not contain this workflow, so a tag
# push would not run it. The workflow file is read from the default branch.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (tag or branch)"
        required: false
        default: "v0.16.0-rc3"
      cuda_arch:
        description: "CMAKE_CUDA_ARCHITECTURES (70-real = V100)"
        required: false
        default: "70-real"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          submodules: true
          fetch-depth: 0

      - name: Resolve latest CUDA 12.9 images
        id: cuda
        run: |
          curl -fsSL "https://hub.docker.com/v2/repositories/nvidia/cuda/tags?name=12.9&page_size=100" -o tags.json
          python3 - <<'EOF'
          import json, os
          names = [t["name"] for t in json.load(open("tags.json"))["results"]
                   if t["name"].endswith("-devel-ubuntu24.04")]
          if not names:
              raise SystemExit("no CUDA 12.9 devel-ubuntu24.04 tags found on Docker Hub")
          key = lambda s: tuple(int(p) for p in s.split("-")[0].split("."))
          devel = sorted(names, key=key)[-1]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"devel={devel}\n")
              f.write(f"runtime={devel.replace('devel', 'runtime')}\n")
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=v0.16.0-rc3
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_IMAGE=nvidia/cuda:${{ steps.cuda.outputs.devel }}
            CUDA_RUNTIME_IMAGE=nvidia/cuda:${{ steps.cuda.outputs.runtime }}
            CUDA_ARCH=${{ github.event.inputs.cuda_arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
